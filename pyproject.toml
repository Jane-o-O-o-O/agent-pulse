[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pulse"
version = "0.1.0"
description = "Real-time AI Agent activity dashboard — sessions, tokens, tools, projects at a glance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "click>=8.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn>=0.20"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
agent-pulse = "agent_pulse.cli:main"

[tool.ruff]
line-length = 100
