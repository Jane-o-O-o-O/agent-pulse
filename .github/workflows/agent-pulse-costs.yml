# 🫀 Agent Pulse — Cost Monitoring GitHub Action
#
# Monitors AI agent costs and sends alerts when thresholds are exceeded.
# Add this to your repo's .github/workflows/ to track agent spending.
#
# Required secrets:
#   AGENT_PULSE_DB  — Path to Hermes state.db (or leave default)
#   DISCORD_WEBHOOK — Discord webhook URL (optional)
#   SLACK_WEBHOOK   — Slack webhook URL (optional)
#
# Usage:
#   1. Copy this file to .github/workflows/agent-pulse-costs.yml
#   2. Set up secrets in your repo settings
#   3. Runs daily at 9am UTC + on push to main

name: "🫀 Agent Pulse — Cost Monitor"

on:
  schedule:
    - cron: "0 9 * * *"  # Daily at 9am UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours of history to analyze"
        default: "24"
        type: string

permissions:
  contents: read
  issues: write  # For creating cost alert issues

jobs:
  cost-check:
    name: "💰 Cost Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent Pulse
        run: pip install agent-pulse

      - name: Run Health Check
        id: health
        run: |
          agent-pulse health --json > health.json || true
          cat health.json
        continue-on-error: true

      - name: Run Cost Analysis
        id: costs
        run: |
          HOURS="${{ github.event.inputs.hours || '24' }}"
          agent-pulse --hours "$HOURS" --json > report.json || true
          echo "report<<REPORT_EOF" >> $GITHUB_OUTPUT
          agent-pulse status >> $GITHUB_OUTPUT || echo "No data" >> $GITHUB_OUTPUT
          echo "REPORT_EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run Forecast
        id: forecast
        run: |
          agent-pulse forecast --json > forecast.json || true
          echo "forecast<<FORECAST_EOF" >> $GITHUB_OUTPUT
          agent-pulse forecast >> $GITHUB_OUTPUT || echo "No forecast data" >> $GITHUB_OUTPUT
          echo "FORECAST_EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check Alerts
        id: alerts
        run: |
          agent-pulse alerts --json > alerts.json 2>&1 || true
          # Check if alerts exist
          if grep -q "exceeded" alerts.json 2>/dev/null; then
            echo "has_alerts=true" >> $GITHUB_OUTPUT
          else
            echo "has_alerts=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Create Issue on Cost Alert
        if: steps.alerts.outputs.has_alerts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let alerts = 'Cost alert triggered';
            try {
              alerts = fs.readFileSync('alerts.json', 'utf8');
            } catch {}
            let forecast = 'No forecast data';
            try {
              forecast = fs.readFileSync('forecast.json', 'utf8');
            } catch {}

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🫀 Agent Pulse — Cost Alert',
              body: `## 💰 Cost Alert\n\n\`\`\`\n${alerts}\n\`\`\`\n\n## 🔮 Forecast\n\n\`\`\`json\n${forecast}\n\`\`\`\n\n> Auto-generated by [Agent Pulse](https://github.com/Jane-o-O-o-O/agent-pulse)`,
              labels: ['cost-alert', 'automated'],
            });

      - name: Post to Discord
        if: steps.alerts.outputs.has_alerts == 'true' && env.DISCORD_WEBHOOK
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"🫀 **Agent Pulse Cost Alert**\n$(cat alerts.json | head -5)\"}" \
               "$DISCORD_WEBHOOK" || true

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: agent-pulse-report
          path: |
            report.json
            forecast.json
            health.json
            alerts.json
          retention-days: 30

  optimize:
    name: "💡 Optimization Tips"
    runs-on: ubuntu-latest
    needs: cost-check
    if: github.event_name == 'schedule'  # Only on daily schedule
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent Pulse
        run: pip install agent-pulse

      - name: Find Savings
        run: |
          agent-pulse optimize --json > optimize.json || true
          echo "## 💡 Cost Optimization Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          agent-pulse optimize >> $GITHUB_STEP_SUMMARY || echo "No suggestions" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Model Leaderboard
        run: |
          echo "## 🏆 Model Leaderboard" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          agent-pulse leaderboard >> $GITHUB_STEP_SUMMARY || echo "No data" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
